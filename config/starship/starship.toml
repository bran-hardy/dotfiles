# starship.toml
# Full docs: https://starship.rs/config/

# Overall format — what appears on the prompt line
format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

# Wait 10ms for starship to check files under the current directory
scan_timeout = 10

# Blank line between prompts for breathing room
add_newline = true

[character]
success_symbol = "[❯](bold cyan)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

[directory]
style            = "bold blue"
truncation_length = 3
truncate_to_repo = true
format           = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style  = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
format     = '([\[$all_status$ahead_behind\]]($style) )'
style      = "bold yellow"
conflicted = "="
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?"
modified   = "!"
staged     = "+"
renamed    = "»"
deleted    = "✘"

[cmd_duration]
min_time          = 2000      # Only show if command took >2 seconds
format            = "took [$duration](bold yellow) "
show_milliseconds = false

[nodejs]
symbol = " "
format = "[$symbol($version)]($style) "
style  = "bold green"

[python]
symbol = " "
format = '[$symbol${pyenv_prefix}(${version})(\($virtualenv\))]($style) '
style  = "bold yellow"

[rust]
symbol = " "
format = "[$symbol($version)]($style) "
style  = "bold red"

[lua]
symbol = " "
format = "[$symbol($version)]($style) "
style  = "bold blue"

[package]
disabled = true   # hides package version noise; re-enable if you want it
